# De limiet is afgestemd op de Intake-tool: een opname van een uur is als m4a (iPhone
# Dictafoon) 30-60 MB, als wav tot een paar honderd MB. De belastbaarheidsanalyse
# accepteert bewust enkel activities.csv (niet de volledige Strava-zip) en blijft daar
# sowieso ruim onder.
[server]
maxUploadSize = 400

# De prestatietest-suite (static/prestatietest.html) is een zelfstandige HTML-tool die
# Streamlit hier enkel uitlevert, niet rendert. Bewust als echte pagina i.p.v. in een iframe:
# de printbare atleet-verslagen (@media print, A4) en de deep-links (#voeding, #lactate, ...)
# werken alleen in een volwaardig venster. Let op: static-bestanden vallen buiten de
# wachtwoord-gate van app.py — de suite bewaart zelf geen atleetdata, dus dat is een
# bewuste afweging, geen vergetelheid.
enableStaticServing = true

# Huisstijl De Musculatuur — zelfde tokens als theme.py (licht, premium).
# Fijnere details komen uit de CSS in app.py; dit blok kleurt Streamlit's eigen widgets.
[theme]
primaryColor = "#63B995"
backgroundColor = "#F8F3F0"
secondaryBackgroundColor = "#F3EBE6"
textColor = "#3D2E29"
font = "sans serif"
