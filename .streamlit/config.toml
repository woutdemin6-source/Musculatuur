# De limiet is afgestemd op de Intake-tool: een opname van een uur is als m4a (iPhone
# Dictafoon) 30-60 MB, als wav tot een paar honderd MB. De belastbaarheidsanalyse
# accepteert bewust enkel activities.csv (niet de volledige Strava-zip) en blijft daar
# sowieso ruim onder.
[server]
maxUploadSize = 400

# De prestatietest-suite draait sinds de integratie als Streamlit-component binnen de app
# (components/prestatietest/index.html, zie suite.py) — achter de login, met de actieve atleet.
# Static serving blijft aan voor static/ (logo); er staat daar geen tool meer.
enableStaticServing = true

# Huisstijl De Musculatuur — zelfde tokens als theme.py (licht, premium).
# Fijnere details komen uit de CSS in app.py; dit blok kleurt Streamlit's eigen widgets.
[theme]
primaryColor = "#63B995"
backgroundColor = "#F8F3F0"
secondaryBackgroundColor = "#F3EBE6"
textColor = "#3D2E29"
font = "sans serif"
